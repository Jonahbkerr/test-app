<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Speech</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
    main { width: 100%; max-width: 680px; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    h1 span { color: #8b5cf6; }
    .sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; padding: 1.25rem; }
    textarea { width: 100%; min-height: 180px; resize: vertical; padding: 0.75rem; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; color: #e2e8f0; font-size: 1rem; line-height: 1.5; font-family: inherit; }
    textarea:focus, select:focus { outline: none; border-color: #8b5cf6; }
    .count { text-align: right; color: #64748b; font-size: 0.75rem; margin: 0.25rem 0 1rem; }
    .row { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.375rem; }
    label b { color: #e2e8f0; font-weight: 600; }
    select { width: 100%; padding: 0.6rem; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; color: #e2e8f0; font-size: 0.9rem; }
    input[type=range] { width: 100%; accent-color: #8b5cf6; }
    .sliders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button { padding: 0.65rem 1.4rem; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: #e2e8f0; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
    button:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #8b5cf6; border-color: #8b5cf6; color: #fff; font-weight: 600; }
    button.primary:hover:not(:disabled) { background: #7c3aed; }
    .status { margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; min-height: 1.2em; }
    .status.err { color: #f87171; }
    mark { background: #8b5cf6; color: #fff; border-radius: 3px; }
    #reader { display: none; margin-top: 1rem; padding: 0.75rem; background: #0f172a; border-radius: 0.5rem; line-height: 1.6; white-space: pre-wrap; max-height: 200px; overflow: auto; }
    @media (max-width: 520px) { .sliders { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Text to <span>Speech</span></h1>
    <p class="sub">Type or paste text, pick a voice, and listen. Runs entirely in your browser.</p>

    <div class="card">
      <textarea id="text" placeholder="Enter text to read aloud...">Hello! Type something here and press Speak.</textarea>
      <div class="count"><span id="count">0</span> characters</div>

      <div class="row">
        <div>
          <label for="voice">Voice</label>
          <select id="voice"></select>
        </div>
        <div class="sliders">
          <div><label>Speed <b id="rateV">1.0</b>x</label><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></div>
          <div><label>Pitch <b id="pitchV">1.0</b></label><input type="range" id="pitch" min="0" max="2" step="0.1" value="1"></div>
          <div><label>Volume <b id="volV">100</b>%</label><input type="range" id="vol" min="0" max="1" step="0.05" value="1"></div>
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="speak">▶ Speak</button>
        <button id="pause" disabled>⏸ Pause</button>
        <button id="stop" disabled>■ Stop</button>
        <button id="clear">Clear</button>
      </div>
      <div class="status" id="status"></div>
      <div id="reader"></div>
    </div>
  </main>

  <script>
    const synth = window.speechSynthesis;
    const $ = id => document.getElementById(id);
    const text = $('text'), voiceSel = $('voice'), status = $('status'), reader = $('reader');
    let voices = [];

    function setStatus(msg, err) { status.textContent = msg; status.className = 'status' + (err ? ' err' : ''); }

    if (!synth) {
      setStatus('Speech synthesis is not supported in this browser.', true);
      $('speak').disabled = true;
    }

    function loadVoices() {
      voices = synth.getVoices().sort((a, b) => a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
      voiceSel.innerHTML = '';
      voices.forEach((v, i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `${v.name} (${v.lang})${v.default ? ' — default' : ''}`;
        voiceSel.appendChild(o);
      });
      const saved = localStorage.getItem('tts-voice');
      const idx = voices.findIndex(v => v.name === saved);
      const def = idx >= 0 ? idx : Math.max(0, voices.findIndex(v => v.default));
      voiceSel.value = def;
    }
    if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

    voiceSel.onchange = () => { try { localStorage.setItem('tts-voice', voices[voiceSel.value].name); } catch (e) {} };

    const bind = (id, out, fmt) => { const el = $(id); el.oninput = () => $(out).textContent = fmt(el.value); };
    bind('rate', 'rateV', v => (+v).toFixed(1));
    bind('pitch', 'pitchV', v => (+v).toFixed(1));
    bind('vol', 'volV', v => Math.round(v * 100));

    const updateCount = () => $('count').textContent = text.value.length;
    text.oninput = updateCount; updateCount();

    function setSpeaking(on) {
      $('pause').disabled = !on; $('stop').disabled = !on;
      $('speak').disabled = on;
      if (!on) { $('pause').textContent = '⏸ Pause'; reader.style.display = 'none'; }
    }

    function showHighlight(full, start, end) {
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      reader.innerHTML = esc(full.slice(0, start)) + '<mark>' + esc(full.slice(start, end)) + '</mark>' + esc(full.slice(end));
      const m = reader.querySelector('mark'); if (m) m.scrollIntoView({ block: 'nearest' });
    }

    $('speak').onclick = () => {
      const t = text.value.trim();
      if (!t) return setStatus('Please enter some text first.', true);
      synth.cancel();
      const u = new SpeechSynthesisUtterance(t);
      if (voices[voiceSel.value]) { u.voice = voices[voiceSel.value]; u.lang = u.voice.lang; }
      u.rate = +$('rate').value; u.pitch = +$('pitch').value; u.volume = +$('vol').value;
      u.onstart = () => { setSpeaking(true); setStatus('Speaking...'); reader.style.display = 'block'; showHighlight(t, 0, 0); };
      u.onboundary = e => {
        if (e.name && e.name !== 'word') return;
        const len = e.charLength || (t.slice(e.charIndex).search(/\s|$/));
        showHighlight(t, e.charIndex, e.charIndex + len);
      };
      u.onend = () => { setSpeaking(false); setStatus('Done.'); };
      u.onerror = e => { setSpeaking(false); if (e.error !== 'canceled' && e.error !== 'interrupted') setStatus('Error: ' + e.error, true); };
      synth.speak(u);
    };

    $('pause').onclick = () => {
      if (synth.paused) { synth.resume(); $('pause').textContent = '⏸ Pause'; setStatus('Speaking...'); }
      else { synth.pause(); $('pause').textContent = '▶ Resume'; setStatus('Paused.'); }
    };
    $('stop').onclick = () => { synth.cancel(); setSpeaking(false); setStatus('Stopped.'); };
    $('clear').onclick = () => { synth.cancel(); text.value = ''; updateCount(); setSpeaking(false); setStatus(''); text.focus(); };
  </script>
</body>
</html>
